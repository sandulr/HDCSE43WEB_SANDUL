<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - HTML</title>
</head>
<body>
    <h1>HTML Table</h1>

    <!-- Table -->

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Bread</td>
            <td>125.00</td>
        </tr>
        <tr>
            <td>Mango</td>
            <td>45.00</td>
        </tr>
    </table>

</body>
</html>
